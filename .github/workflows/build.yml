name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Imza anahtarini hazirla
        env:
          KS_B64: ${{ secrets.QANOPY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/qanopy.jks"
            echo "QANOPY_KEYSTORE_PATH=$RUNNER_TEMP/qanopy.jks" >> "$GITHUB_ENV"
          fi
      - name: APK derle
        env:
          QANOPY_KEY_PASSWORD: ${{ secrets.QANOPY_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Qanopy-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  modul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modulu paketle
        run: |
          cd module
          mkdir -p META-INF/com/google/android
          curl -fsSL -o META-INF/com/google/android/update-binary https://raw.githubusercontent.com/topjohnwu/Magisk/master/scripts/module_installer.sh
          grep -q "install_module" META-INF/com/google/android/update-binary || { echo "Kurulum betigi beklenen icerikte degil"; exit 1; }
          echo "#MAGISK" > META-INF/com/google/android/updater-script
          zip -r9 ../qanopy_core-X1.2b.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Qanopy-core-modul
          path: qanopy_core-X1.2b.zip
